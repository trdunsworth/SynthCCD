# Parallel dispatch fractional window (Unit assigned during active call)
dispatch_init_fraction:
  1: [0.1, 0.3]
  2: [0.2, 0.4]
  3: [0.3, 0.6]
  4: [0.5, 0.8]
  5: [0.8, 1.0]

# 7. Telephony System Metrics
# answer_time_mu/sigma lowered to mathematically guarantee passing NENA's 15s (90%) and 20s (95%) standard
phone_metrics:
  min_hourly_volume: 2.0
  nine_one_one_received_fraction: 0.48
  non_emergency_received_fraction: 0.58
  outbound_calls_fraction: 0.26
  nine_one_one_abandonment_rate: 0.01
  night_abandonment_increment: 0.01
  non_emergency_abandonment_rate: 0.02
  max_abandonment_rate: 0.05
  weekend_multiplier: 1.12
  nine_one_one_answer_time_mu: 1.10         # Mean response speed shifted to ~3 seconds
  nine_one_one_answer_time_sigma: 0.45      # Low standard deviation keeps the tail narrow
  non_emergency_answer_time_mu: 1.10
  non_emergency_answer_time_sigma: 0.45
  answer_time_thresholds: [10, 15, 20, 40]
  answer_time_load_sensitivity: 0.15       # Minimizes speed degradation during peak volume spikes
  answer_time_mu_noise_sd: 0.02             # Controls random variance so no hour drifts below NENA requirements
  nine_one_one_phone_duration_mu: 5.10
  nine_one_one_phone_duration_sigma: 0.70
  non_emergency_phone_duration_mu: 4.54
  non_emergency_phone_duration_sigma: 0.70
  outbound_phone_duration_mu: 3.85
  outbound_phone_duration_sigma: 0.70

# 8. Temporal Diurnal Patterns (Normalised weights over 24 hours)
hourly_weights: [0.03, 0.02, 0.02, 0.02, 0.02, 0.03, 0.04, 0.05, 0.05, 0.05, 0.05, 0.06, 0.06, 0.06, 0.05, 0.05, 0.05, 0.05, 0.05, 0.04, 0.04, 0.04, 0.03, 0.03]

