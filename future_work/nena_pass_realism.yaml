      - ["Structure Fire", 0.70]
      - ["Rescue Call", 0.30]
    2:
      - ["Fire Alarm", 0.60]
      - ["Gas Leak", 0.40]
    3:
      - ["Smoke Investigation", 0.50]
      - ["CO Investigation", 0.50]
    4:
      - ["Electrical Wiring Problem", 0.60]
      - ["Elevator Rescue", 0.40]
    5:
      - ["Lockout / Public Service", 1.0]
  EMS:
    1:
      - ["Cardiac Arrest", 0.50]
      - ["Difficulty Breathing", 0.50]
    2:
      - ["Chest Pain", 0.40]
      - ["Unconscious Person", 0.60]
    3:
      - ["Seizure", 0.50]
      - ["Overdose", 0.50]
    4:
      - ["Fall Injury", 0.60]
      - ["Diabetic Problem", 0.40]
