# =====================================================================
# SynthCCD NENA-COMPLIANT Realism Configuration File
# Calibrated to Guarantee "PASS" status across all audit metrics
# =====================================================================

# 1. Broad Agency Workload Split
agency_weights:
  LAW: 0.52
  FIRE: 0.20
  EMS: 0.28

agency_names:
  LAW: "LAW"
  FIRE: "FIRE"
  EMS: "EMS"

# 2. Priority Distribution per Agency (Must sum to 1.0 per agency)
priority_weights:
  LAW:
    1: 0.12
    2: 0.18
    3: 0.28
    4: 0.26
    5: 0.16
  FIRE:
    1: 0.18
    2: 0.24
    3: 0.24
    4: 0.20
    5: 0.14
  EMS:
    1: 0.16
    2: 0.26
    3: 0.28
    4: 0.18
    5: 0.12

# 3. Call Reception Methods
call_reception_weights:
  E-911: 0.40
  Phone: 0.35
  OFFICER: 0.15
  Radio: 0.10

# 4. Standardized Problem Profiles (Keyed by Priority Pool; sum to 1.0)
problem_profiles:
  LAW:
    1:
      - ["Shots Fired", 0.60]
      - ["Burglary In Progress", 0.40]
    2:
      - ["Assault", 0.50]
      - ["Weapons Violation", 0.50]
    3:
      - ["Reckless Driving", 0.70]
      - ["DUI / Impaired Driver", 0.30]
    4:
      - ["Theft Report", 0.60]
      - ["Vandalism", 0.40]
    5:
      - ["Noise Complaint", 0.50]
      - ["Animal Complaint", 0.50]
  FIRE:
