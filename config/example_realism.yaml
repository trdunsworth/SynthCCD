# Shift structure: crew rotation pattern plus the shifts on the clock.
# rotation: one crew-group id per calendar day, repeating. Day 1 is the weekday
#   given by cycle_start_weekday (0 = Monday). This example mirrors a 2x12h
#   center with 4 shifts (A/B day, C/D night) on a 14-day rotation where group 1
#   (A day + C night) and group 2 (B day + D night) alternate:
#   1,1,2,2,1,1,1,2,2,1,1,2,2,2  (14 days, starting Monday).
# shifts: each entry lists a shift name, a human label, its on-duty hours, its
#   crew rotation group, and staffing. Omit calltakers/dispatchers to fall back
#   to the global --calltaker-pool-size / --dispatcher-pool-size split.
shift_config:
  name: "2x12h-4shift-14day"
  cycle_start_weekday: 0
  rotation: [1, 1, 2, 2, 1, 1, 1, 2, 2, 1, 1, 2, 2, 2]
  shifts:
    - name: A
      label: DAY
      start_hour: 6
      start_minute: 0
      end_hour: 18
      end_minute: 0
      rotation: 1
      calltakers: 3
      dispatchers: 2
    - name: B
      label: DAY
      start_hour: 6
      start_minute: 0
      end_hour: 18
      end_minute: 0
      rotation: 2
      calltakers: 3
      dispatchers: 2
    - name: C
      label: NIGHT
      start_hour: 18
      start_minute: 0
      end_hour: 6
      end_minute: 0
      rotation: 1
      calltakers: 3
      dispatchers: 2
    - name: D
      label: NIGHT
      start_hour: 18
      start_minute: 0
      end_hour: 6
      end_minute: 0
      rotation: 2
      calltakers: 3
      dispatchers: 2

# Personnel name locales per country (ISO 3166-1 alpha-2). The country is
# derived from the geocoded OSM area; the request's --country flag is the
# fallback when the area yields no country. This section overrides the built-in
# country -> Faker-locale map for matching personnel rosters. Each value is
# either a list of Faker locales (equal weight) or a mapping of locale to
# weight (normalized at generation time).
#
# The default US deployment uses a weighted multi-ethnic blend approximating a
# typical large American call center. Locale choices favor Faker providers with
# reliable name data; CJK locales emit names in native family-name-first order.
name_locales:
  US:
    en_US: 0.64
    es_MX: 0.16
    en_NG: 0.07
    zh_CN: 0.03
    fil_PH: 0.03
    fr_CA: 0.02
    hi_IN: 0.02
    de_DE: 0.02
    it_IT: 0.02
    pt_BR: 0.02
    ja_JP: 0.01
    ko_KR: 0.01
    ru_RU: 0.01
    ar_SA: 0.01
  # Example: Canadian center with equal English/French weight
  # CA:
  #   - en_CA
  #   - fr_CA
  # Example: Irish center with a mixed English/Irish-Gaelic roster
  # IE:
  #   en_IE: 0.7
  #   ga_IE: 0.3