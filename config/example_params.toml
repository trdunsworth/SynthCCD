# synth911gen3 Generation Parameters (TOML format)
# Usage: uv run synth911gen3 generate --params config/example_params.toml
# Keys mirror the CLI options (area, format, config) or the GenerationRequest fields
# (area_query, output_format, realism_config_path). CLI flags override file values.

rows = 75000
area = "Austin, TX"
format = "parquet"
dataset = "incidents"
id_format = "integer"
output_dir = "output"
output_stem = "austin_911"
start_date = "2024-03-01"
end_date = "2024-05-31"
seed = 12345
calltaker_pool_size = 18
dispatcher_pool_size = 14
config = "config/example_realism.yaml"
max_memory_bytes = 1073741824  # 1 GiB
country = "US"
include_10_digit_emergency = false