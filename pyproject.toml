[project]
name = "SynthCCD"
version = "0.9.5"
description = "Synthetic 911 CAD and phone data generator"
readme = "README.md"
authors = [
    { name = "Tony Dunsworth", email = "tony.dunsworth@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.3.3",
    "faker>=40.13.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "idna>=3.15",
    "numpy>=2.4.4",
    "overpy>=0.7",
    "pandas>=3.0.2",
    "pydantic>=2.10.0",
    "polars>=1.39.3",
    "pyarrow>=23.0.1",
    "pyyaml>=6.0.3",
    "scipy>=1.18.0",
    "textual>=8.2.3",
    "typer>=0.24.1",
    "uvicorn>=0.34.0",
    "geopandas>=1.1.4",
    "shapely>=2.1.2",
    "sqlalchemy>=2.0.51",
    "psycopg2-binary>=2.9.12",
    "pymysql>=1.2.0",
    "duckdb>=1.5.5",
    "duckdb-engine>=0.17.0",
    "pyodbc>=5.3.0",
    "fpdf2>=2.8.8",
    "pygments>=2.20.0",
    "pymupdf>=1.28.2",
    "sphinx>=9.1.0",
]

[project.scripts]
SynthCCD = "synth911gen3.cli:main"
SynthCCD-tui = "synth911gen3.tui:run"
SynthCCD-serve = "synth911gen3.serve:run"

[build-system]
requires = ["uv_build>=0.10.5,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "synth911gen3"
module-root = "src"

[dependency-groups]
dev = [
    "hypothesis>=6.165.8",
    "pip-audit>=2.10.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.10",
    "truststore>=0.10.4",
    "ty>=0.0.31",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["synth911gen3"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
# `docs/` contains read-only v2-era reference scripts (see AGENTS.md) that are
# intentionally excluded from linting; they are not part of the package.
exclude = ["docs", "scripts", "generate_copyright_pdf.py"]

[tool.ruff.lint]
# B008: typer.Option/Argument in defaults is idiomatic typer
# BLE001: blind Exception catches are used for graceful fallbacks
ignore = ["B008", "BLE001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "B017",   # pytest.raises(Exception) is intentional for validation tests
    "DTZ001", # naive datetimes are fine in test fixtures
    "PLW1510",# subprocess.run without check is intentional in tests
    "SIM201", # negated comparison is readable in assertions
]

[tool.uv.workspace]
members = [
    "synth911gen3",
]
