name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - "docsrc/**"
      - "src/synth911gen3/**"
      - "scripts/build_docs.py"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: UV_SYSTEM_CERTS=true uv sync

      - name: Build documentation
        run: UV_SYSTEM_CERTS=true uv run python scripts/build_docs.py --strict

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
